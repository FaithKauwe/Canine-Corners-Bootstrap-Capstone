<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canine Corner Home</title>

  <!-- use bootstrap framework -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- add custom CSS on top of bootstrap -->
  <link href="styles.css" rel="stylesheet">

</head>
<body>
  
 
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Canine Corner</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="aboutUs.html">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="requestForm.html">Request a Trainer</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="lessons.html">Lessons</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- mt-5 is the bootsrap container that holds the form, all images and h1 and p -->
  <div class="container mt-5">
    <h1>Request a trainer</h1>
    <p>Please provide as much info as possible and we will reach out to you!</p>

    <!-- css grid container that holds the form and the desktop images -->
    <div class="form-grid-container">
      <!-- Form Section -->
      <div class="form-section">
        <form id="userForm">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Your First and Last Name" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="000-000-0000" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">email</label>
                <input type="email" class="form-control" id="email" placeholder="email@address.com" required>
            </div>

            <div class="mb-3">
                <label for="dogName" class="form-label">Dog's Name</label>
                <input type="text" class="form-control" id="dogName" placeholder="Woof!" required>
            </div>

            <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" rows="3" placeholder="Describe your concern!" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
        </form>

        <!-- empty div that gets filled by JS when form is submitted -->
        <div id="feedbackMessage" class="mt-3"></div>
      </div>

      <!-- Desktop Images Section -->
      <div class="images-section desktop-images">
        <img src="images/goodboisit.png" class="form-image desktop-image" alt="Dog training session">
        <img src="images/collie.jpg" class="form-image desktop-image" alt="Happy collie dog">
      </div>
    </div>

    <!-- had to break out mobile pics into separate container to have precise control over their positioning when referencing them in the css -->
    <div class="mobile-images-container">
      <img src="images/goodboisit.png" class="form-image mobile-image mobile-image-top" alt="Dog training session">
      <img src="images/collie.jpg" class="form-image mobile-image mobile-image-bottom" alt="Happy collie dog">
    </div>
</div>

<script>
    // JavaScript to handle form submission and display feedback
    document.getElementById('userForm').addEventListener('submit', function(event) {
        event.preventDefault();  // Prevent default form submission behavior. keep feedback on same page, don't reload page, use the data in custom format

        
        var name = document.getElementById('name').value;
        var phone = document.getElementById('phone').value;
        var email = document.getElementById('email').value;
        var dogName = document.getElementById('dogName').value;
        var notes = document.getElementById('notes').value;

        // Display feedback message
        var feedbackMessage = `
            <h4>Form Submitted Successfully!</h4>
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Phone:</strong> ${phone}</p>
            <p><strong>Email:</strong> ${email}</p>
            <p><strong>Dog's Name:</strong> ${dogName}</p>
        `;

        document.getElementById('feedbackMessage').innerHTML = feedbackMessage;

        // Clear form fields
        document.getElementById('userForm').reset();
    });
</script>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2024 Kiowa Labs. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS and Popper.js (for responsive navbar toggle) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>
</html>
